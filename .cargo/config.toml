# 钉死 cmake 使用 VS 2022 生成器（项目标准工具链，CI windows-latest 默认装 VS 2022）。
#
# 不用自动探测：本机装了 VS 2026 Preview，cmake 4.4 不支持其
# "Visual Studio 18 2026" 生成器名，自动探测会失败。
#
# 本机需装 VS 2022（当前仅有 VS 2019 + VS 2026 Preview，无 VS 2022）。
# 仅在 cmake crate 探测到 x86_64-pc-windows-msvc 目标时生效——var 名含
# 目标三元组，macOS/Linux 目标不受影响（cmake 按当前目标查找对应
# CMAKE_GENERATOR_<triple>，找不到则回退自动探测）。
[env]
CMAKE_GENERATOR_x86_64_pc_windows_msvc = "Visual Studio 17 2022"
